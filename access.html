<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Private access · ApplyPilot</title><style>
:root{color-scheme:dark;--bg:#080d16;--panel:#101a29;--line:#26364a;--muted:#8fa1b7;--text:#edf4fc;--mint:#a8f0d2;--accent:#72d8b2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 18% 10%,#183348 0,transparent 42%),radial-gradient(ellipse at 85% 90%,#12352f 0,transparent 38%),var(--bg);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}.shell{width:min(440px,calc(100% - 36px));padding:38px;border:1px solid #ffffff18;border-radius:26px;background:linear-gradient(145deg,#142235ed,#0d1725f2);box-shadow:0 28px 90px #0008;position:relative;overflow:hidden}.shell:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:36px}.mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#b8f3d8,#62cda8);color:#092219;font-weight:900;font-size:20px;box-shadow:0 8px 28px #6ed9b344}.brand b{letter-spacing:.12em;font-size:13px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.2em;margin-top:2px}.eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.2em}.lock{width:52px;height:52px;border:1px solid #80dabb55;background:#7bd7b018;border-radius:17px;display:grid;place-items:center;margin:20px 0}.lock svg{width:23px}.title{font-size:31px;line-height:1.12;letter-spacing:-.045em;margin:0 0 12px}.sub{color:#aab8c9;margin:0 0 28px;font-size:13px}.field{display:block;color:#d7e2ed;font-size:11px;font-weight:700;letter-spacing:.08em;margin-bottom:9px}input{width:100%;height:54px;border:1px solid #31445b;border-radius:13px;background:#091321;color:white;padding:0 16px;font-size:16px;letter-spacing:.18em;outline:none;transition:.2s}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #72d8b21b}button{width:100%;height:52px;border:0;border-radius:13px;margin-top:14px;background:linear-gradient(100deg,#b3f1d5,#68d0ad);color:#092319;font-size:13px;font-weight:850;cursor:pointer;transition:.2s}button:hover{filter:brightness(1.06);transform:translateY(-1px)}button:disabled{opacity:.6;cursor:wait;transform:none}.error{min-height:20px;color:#ffaaa7;font-size:12px;margin-top:12px}.foot{border-top:1px solid #ffffff12;margin-top:24px;padding-top:18px;color:#74869d;font-size:10px;display:flex;justify-content:space-between;gap:12px}.status{display:flex;align-items:center;gap:7px}.dot{width:6px;height:6px;border-radius:50%;background:#70d6af;box-shadow:0 0 10px #70d6af}.noscript{color:#ffaaa7;font-size:12px}</style></head><body><main class="shell"><div class="brand"><div class="mark">A</div><div><b>APPLYPILOT</b><small>PRIVATE PREVIEW</small></div></div><div class="eyebrow">INVITATION REQUIRED</div><div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="#a8f0d2" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg></div><h1 class="title">A private space<br>for better opportunities.</h1><p class="sub">ApplyPilot is currently available by invitation. Enter the access code you received to continue.</p><form id="unlock"><label class="field" for="code">ACCESS CODE</label><input id="code" name="code" type="password" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="256" required autofocus aria-label="Access code"><button id="submit" type="submit">Continue securely <span aria-hidden="true">↗</span></button><div id="error" class="error" role="alert" aria-live="polite"></div></form><div class="foot"><span class="status"><i class="dot"></i> ENCRYPTED SESSION</span><span>INVITE-ONLY PREVIEW</span></div></main><script>
(async()=>{try{const s=await fetch('/api/auth/status',{cache:'no-store'}).then(r=>r.json());if(s.authenticated)location.replace('/')}catch(e){}})();document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),err=document.getElementById('error'),code=document.getElementById('code').value;b.disabled=true;err.textContent='';try{const r=await fetch('/api/auth/unlock',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({code})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to verify access.');location.replace('/')}catch(x){err.textContent=x.message;document.getElementById('code').select()}finally{b.disabled=false}});</script></body></html>
